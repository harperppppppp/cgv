  </g>

  <!-- ===== popcorn kernels (r=32, cream + butter) ===== -->
  <g>
    <circle cx="130" cy="60" r="32" fill="#FFFDF5"/><circle cx="180" cy="60" r="32" fill="#FFE39A"/><circle cx="230" cy="60" r="32" fill="#FFFDF5"/><circle cx="280" cy="60" r="32" fill="#FFFDF5"/><circle cx="330" cy="60" r="32" fill="#FFE39A"/>
    <circle cx="70" cy="100" r="32" fill="#FFFDF5"/><circle cx="125" cy="100" r="32" fill="#FFFDF5"/><circle cx="180" cy="100" r="32" fill="#FFE39A"/><circle cx="235" cy="100" r="32" fill="#FFFDF5"/><circle cx="290" cy="100" r="32" fill="#FFE39A"/><circle cx="345" cy="100" r="32" fill="#FFFDF5"/><circle cx="400" cy="100" r="32" fill="#FFFDF5"/>
    <circle cx="45" cy="150" r="32" fill="#FFE39A"/><circle cx="100" cy="150" r="32" fill="#FFFDF5"/><circle cx="155" cy="150" r="32" fill="#FFFDF5"/><circle cx="210" cy="150" r="32" fill="#FFFDF5"/><circle cx="265" cy="150" r="32" fill="#FFFDF5"/><circle cx="320" cy="150" r="32" fill="#FFFDF5"/><circle cx="375" cy="150" r="32" fill="#FFFDF5"/><circle cx="425" cy="150" r="32" fill="#FFE39A"/>
    <circle cx="70" cy="200" r="32" fill="#FFFDF5"/><circle cx="125" cy="200" r="32" fill="#FFE39A"/><circle cx="180" cy="200" r="32" fill="#FFFDF5"/><circle cx="235" cy="200" r="32" fill="#FFFDF5"/><circle cx="290" cy="200" r="32" fill="#FFE39A"/><circle cx="345" cy="200" r="32" fill="#FFFDF5"/><circle cx="400" cy="200" r="32" fill="#FFFDF5"/>
