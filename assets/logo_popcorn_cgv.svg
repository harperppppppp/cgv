<svg width="470" height="300" viewBox="0 0 470 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CGV 팝콘 로고 - 하나의 팝콘 덩어리에 CGV">
  <title>CGV Popcorn Logo</title>

  <!-- ===== black outline layer (r=38) ===== -->
  <g fill="#1b1b1b">
    <circle cx="130" cy="60" r="38"/><circle cx="180" cy="60" r="38"/><circle cx="230" cy="60" r="38"/><circle cx="280" cy="60" r="38"/><circle cx="330" cy="60" r="38"/>
    <circle cx="70" cy="100" r="38"/><circle cx="125" cy="100" r="38"/><circle cx="180" cy="100" r="38"/><circle cx="235" cy="100" r="38"/><circle cx="290" cy="100" r="38"/><circle cx="345" cy="100" r="38"/><circle cx="400" cy="100" r="38"/>
    <circle cx="45" cy="150" r="38"/><circle cx="100" cy="150" r="38"/><circle cx="155" cy="150" r="38"/><circle cx="210" cy="150" r="38"/><circle cx="265" cy="150" r="38"/><circle cx="320" cy="150" r="38"/><circle cx="375" cy="150" r="38"/><circle cx="425" cy="150" r="38"/>
    <circle cx="70" cy="200" r="38"/><circle cx="125" cy="200" r="38"/><circle cx="180" cy="200" r="38"/><circle cx="235" cy="200" r="38"/><circle cx="290" cy="200" r="38"/><circle cx="345" cy="200" r="38"/><circle cx="400" cy="200" r="38"/>
