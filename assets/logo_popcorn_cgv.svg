  </g>

  <!-- ===== CGV read into the popcorn (negative space) ===== -->
  <text x="235" y="192" text-anchor="middle" font-family="'Arial Black','Archivo Black',sans-serif" font-weight="900" font-size="122" letter-spacing="4" fill="#1b1b1b">CGV</text>

  <!-- kernels nibbling into the letters so they emerge from the popcorn -->
  <g>
    <circle cx="150" cy="108" r="15" fill="#FFFDF5"/><circle cx="232" cy="104" r="14" fill="#FFE39A"/><circle cx="322" cy="108" r="15" fill="#FFFDF5"/>
    <circle cx="180" cy="188" r="14" fill="#FFE39A"/><circle cx="258" cy="190" r="15" fill="#FFFDF5"/><circle cx="330" cy="188" r="14" fill="#FFFDF5"/>
  </g>
